[project]
name = "googlehomehoso"
version = "0.1.0"
description = "Make Google Home devices speak or play audio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gtts>=2.5.4",
    "nanoid>=2.0.0",
    "pychromecast>=14.0.10",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
